name : ETL pipeline

on:
    push:
        branches:
            - main

jobs:
    extract-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            - name: run python code
              run: python extract.py
    
    transform-job:
        needs: extract-job # this is called job dependency
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            - name: run python code
              run: python transform.py
              
    
    load-job:
        needs: transform-job  # this is called job dependency 
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            - name: run python code
              run: python load.py


